name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "22 0 * * *"
      timezone: "America/Detroit"

jobs:
  validate:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Build validation image
        id: validation-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/workflows/validate
          file: .github/workflows/validate/Dockerfile
          platforms: linux/amd64
          tags: brands-image-validation:${{ github.run_id }}-${{ github.run_attempt }}
          load: true
          push: false

      - name: Generate SBOM and enforce High/Critical gate
        uses: ./.github/actions/container-security
        with:
          image: docker:${{ steps.validation-image.outputs.imageid }}
          platforms: linux/amd64
          report-directory: ${{ runner.temp }}/container-security/brands-validation
          artifact-name: container-security-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run image validation
        env:
          VALIDATION_IMAGE: ${{ steps.validation-image.outputs.imageid }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --workdir /github/workspace \
            --env GITHUB_ACTIONS=true \
            "$VALIDATION_IMAGE"
